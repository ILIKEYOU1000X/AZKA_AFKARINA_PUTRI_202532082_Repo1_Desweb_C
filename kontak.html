<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZKA-LUCU - Kontak</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root { --bg-color: #c4d6fc; --secondary-bg: #6b9aff; --primary-blue: #1747af; --text-light: #f3f6fc; --gray-light: #f8f8fa; }
        body { background-color: var(--bg-color); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* NAVBAR */
        nav { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: rgba(83, 127, 250, 0.95); z-index: 1000; border-bottom: 1px solid rgba(83, 127, 250, 0.95); }
        
        /* Mengatur area logo agar gambar dan teks sejajar di tengah */
        .logo-area { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }
        /* Menjinakkan ukuran logo gambar supaya pas (tidak raksasa) */
        .logo-area img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }
        .logo-area h1 { font-size: 1.5rem; font-weight: 700; }
        .logo-area span { color: var(--primary-blue); }
        
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-weight: 600; text-transform: uppercase; font-size: 0.9rem; }
        .nav-links a.active { color: var(--primary-blue); }
        .menu-toggle { display: none; flex-direction: column; cursor: pointer; background: transparent; border: none; gap: 5px; }
        .menu-toggle .bar { height: 3px; width: 25px; background-color: #ffffff; border-radius: 2px; }

        /* CONTACT STYLE */
        main { flex: 1; margin-top: 90px; padding: 60px 50px 80px 50px; }
        .section-title { text-align: center; font-size: 2.5rem; margin-bottom: 50px; text-transform: uppercase; }
        .section-title span { color: var(--primary-blue); }

        .contact-container { display: flex; flex-direction: column; gap: 40px; max-width: 900px; margin: 0 auto; }
        @media (min-width: 768px) { .contact-container { flex-direction: row; } }
        .contact-info { flex: 1; background-color: var(--secondary-bg); padding: 30px; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; }
        .contact-info h3 { color: var(--primary-blue); margin-bottom: 20px; font-size: 1.5rem; }
        .contact-method { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .contact-method i { color: var(--primary-blue); font-size: 1.3rem; width: 30px; }
        .social-media { margin-top: 20px; display: flex; gap: 15px; }
        .social-media a { display: inline-flex; width: 40px; height: 40px; background-color: rgba(255,255,255,0.05); color: var(--text-light); justify-content: center; align-items: center; border-radius: 50%; text-decoration: none; transition: 0.3s; }
        .social-media a:hover { background-color: var(--primary-blue); color: var(--bg-color); transform: translateY(-5px); }
        
        .form-wrapper { flex: 1.3; }
        .iframe-container { position: relative; overflow: hidden; width: 100%; padding-top: 100%; border-radius: 10px; border: 1px solid rgba(0, 210, 255, 0.3); }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* FOOTER */
        footer { background-color: #133d8f; padding: 40px 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
        footer p { color: var(--gray-light); font-size: 0.95rem; line-height: 1.6; max-width: 600px; margin: 0 auto; }

        /* RESPONSIVE */
        @media screen and (max-width: 768px) {
            nav { padding: 20px 25px; }
            .menu-toggle { display: flex; }
            .nav-links { display: none; flex-direction: column; width: 100%; position: absolute; top: 90px; left: 0; background: rgba(11, 12, 16, 0.98); padding: 20px; border-bottom: 2px solid var(--primary-blue); gap: 20px; text-align: center; }
            .nav-links.active { display: flex; }
            main { padding: 40px 20px; }
            .section-title { font-size: 2rem; }
        }
    </style>
</head>

</html>
